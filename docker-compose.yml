services:
  db:
    image: postgres:15-alpine
    container_name: mjm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset di .env}
      POSTGRES_DB: ${POSTGRES_DB:-mjm_db}
    # Bind ke loopback VM saja; backend mengakses lewat network Docker.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mjm_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mjm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL belum diset di .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET belum diset di .env}
    # API tidak perlu terbuka ke luar; frontend memproksinya via /api-proxy.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mjm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      PORT: 3000
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    ports:
      - "${FRONTEND_PORT:-8080}:3000"

volumes:
  pgdata:
